# Step 1 of the pipeline: prove the three.js engine renders on a free GitHub runner with software GL (no GPU).
name: render-test
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: engine/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/fetch-core.sh
      - name: install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      - run: npm ci
        working-directory: engine
      - name: render 2 s (1080x1920, software GL)
        working-directory: engine
        env:
          CHROME: /usr/bin/google-chrome
          CHROME_ARGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist --no-sandbox
          XQ: "&dur=2"
        run: |
          /usr/bin/time -v node render.cjs out/ci-test.mp4 1080 1920 30 2>&1 | grep -E "frames in|Elapsed|Maximum resident"
          ffprobe -v error -show_entries stream=width,height,nb_frames -of csv=p=0 out/ci-test.mp4
      - uses: actions/upload-artifact@v4
        with: { name: ci-test, path: engine/out/ci-test.mp4 }
