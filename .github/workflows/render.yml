# Full render of a job (jobs/<name>/{script.txt,cards.json,voice.mp3}): timing+captions -> N parallel frame shards (software GL) -> stitch + mux.
name: render
on:
  workflow_dispatch:
    inputs:
      job: { description: "job folder name under jobs/", required: true, default: pig-war }
      shards: { description: "parallel render shards", required: true, default: "8" }
      chat_id: { description: "Telegram chat to notify (optional)", required: false, default: "" }
env:
  CHROME: /usr/bin/google-chrome
  CHROME_ARGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist --no-sandbox
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      scene: ${{ steps.scene.outputs.scene }}
      frames: ${{ steps.n.outputs.frames }}
      list: ${{ steps.n.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: scene
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ inputs.chat_id || vars.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          # GUARD: never render a topic that has no staged scene (it would silently reuse another video's visuals)
          if [ -f jobs/${{ inputs.job }}/shots.json ]; then echo "scene=kit" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.job }}" = "pig-war" ]; then echo "scene=pigwar" >> $GITHUB_OUTPUT
          else
            curl -fsS "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=Render stopped: job ${{ inputs.job }} has no storyboard/scene yet, so it would show the wrong visuals. Nothing was rendered." >/dev/null
            echo "::error::no storyboard for ${{ inputs.job }}"; exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: bash pipeline/prepare.sh jobs/${{ inputs.job }}
      - id: n
        run: |
          D=$(python3 -c "import json;print(json.load(open('jobs/${{ inputs.job }}/timing.json'))['duration'])")
          F=$(python3 -c "print(round($D*30))"); S=${{ inputs.shards }}
          echo "frames=$F" >> $GITHUB_OUTPUT
          echo "list=$(python3 -c "print(list(range($S)))")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: prep-${{ inputs.job }}
          path: |
            jobs/${{ inputs.job }}/cap/overlay.mov
            jobs/${{ inputs.job }}/timing.json
            jobs/${{ inputs.job }}/shots.json
            engine/film/words.json
            engine/film/lines.json
  shard:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { i: "${{ fromJSON(needs.prepare.outputs.list) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "prep-${{ inputs.job }}", path: prep }
      - run: |
          cp prep/engine/film/*.json engine/film/
          [ -f prep/jobs/${{ inputs.job }}/shots.json ] && cp prep/jobs/${{ inputs.job }}/shots.json engine/film/shots.json || true
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: engine/package-lock.json }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          bash scripts/fetch-core.sh
      - run: npm ci
        working-directory: engine
      - name: render shard ${{ matrix.i }}
        working-directory: engine
        env: { XQ: "&scene=${{ needs.prepare.outputs.scene }}" }
        run: |
          F=${{ needs.prepare.outputs.frames }}; S=${{ inputs.shards }}; I=${{ matrix.i }}
          export FROM=$(( F * I / S )) TO=$(( F * (I + 1) / S ))
          node render.cjs out/shard-$I.mp4 1080 1920 30 | tr '\r' '\n' | tail -2
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.i }}", path: "engine/out/shard-${{ matrix.i }}.mp4" }
  finish:
    needs: [prepare, shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: shards }
      - uses: actions/download-artifact@v4
        with: { name: "prep-${{ inputs.job }}", path: prep }
      - name: stitch + mux
        run: |
          mkdir -p jobs/${{ inputs.job }}/cap out
          cp prep/jobs/${{ inputs.job }}/cap/overlay.mov jobs/${{ inputs.job }}/cap/
          for i in $(seq 0 $(( ${{ inputs.shards }} - 1 ))); do echo "file '$PWD/shards/shard-$i/shard-$i.mp4'"; done > list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy out/raw.mp4
          bash pipeline/mux.sh jobs/${{ inputs.job }} out/raw.mp4 out/final_${{ inputs.job }}.mp4
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,duration -of csv=p=0 out/final_${{ inputs.job }}.mp4
          ffmpeg -hide_banner -i out/final_${{ inputs.job }}.mp4 -af ebur128 -f null - 2>&1 | grep "I:" | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: "final-${{ inputs.job }}", path: "out/final_${{ inputs.job }}.mp4" }
      - name: send to Telegram
        if: ${{ inputs.chat_id != '' }}
        env: { TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
        run: |
          curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" -F chat_id=${{ inputs.chat_id }} -F video=@out/final_${{ inputs.job }}.mp4 -F supports_streaming=true -F width=1080 -F height=1920 \
            -F caption="Render ready: ${{ inputs.job }}. Approve to schedule, or request changes." \
            -F 'reply_markup={"inline_keyboard":[[{"text":"Approve","callback_data":"approve:${{ inputs.job }}"},{"text":"Changes","callback_data":"changes:${{ inputs.job }}"}]]}'
  notify_failure:
    needs: [prepare, shard, finish]
    if: ${{ always() && contains(needs.*.result, 'failure') && inputs.chat_id != '' }}
    runs-on: ubuntu-24.04
    steps:
      - env: { T: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
        run: curl -fsS "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=${{ inputs.chat_id }}" --data-urlencode "text=Render failed for ${{ inputs.job }}. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
