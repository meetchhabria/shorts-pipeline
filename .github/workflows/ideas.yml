name: ideas
on:
  workflow_dispatch:
    inputs:
      mode: { description: "ideas | cards", required: true, default: ideas }
      job: { description: "job id", required: true }
      hint: { description: "topic hint", required: false, default: "" }
  schedule:
    - cron: "0 2 * * *"   # 07:30 IST: morning ideas
permissions: { contents: write }
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  ideas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: j
        run: echo "job=${{ inputs.job || '' }}" >> $GITHUB_OUTPUT; [ -n "${{ inputs.job }}" ] || echo "job=$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
      - name: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ vars.TELEGRAM_OWNER_CHAT_ID }}
        run: python3 pipeline/ideas.py "${{ inputs.mode || 'ideas' }}" "$(echo '${{ steps.j.outputs.job }}')" "${{ inputs.hint }}"
      - run: |
          git config user.name shorts-bot; git config user.email "bot@users.noreply.github.com"
          git add jobs; git commit -m "jobs: ${{ steps.j.outputs.job }} ideas/cards" || exit 0
          git pull --rebase -q; git push -q
